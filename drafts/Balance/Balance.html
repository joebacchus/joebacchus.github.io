<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* Alignment */
      mtable.right-align mtd,
      mtable mtd.right-align,
      mtable.left-align mtd.right-align,
      mtable.aligned mtd:nth-child(odd) {
        justify-items: end;
        text-align: right;
      }
      mtable.cases mtd,
      mtable.left-align mtd,
      mtable mtd.left-align,
      mtable.aligned mtd:nth-child(even),
      math:is(:not([display])) > mtable.multiline-equation mtd {
        justify-items: start;
        text-align: left;
      }
      mtable.cases mtd,
      mtable.aligned mtd,
      mtable mtd.flushed,
      mtable mtd.left-flush {
        padding-left: 0;
      }
      mtable.cases mtd,
      mtable.aligned mtd,
      mtable mtd.flushed,
      mtable mtd.right-flush {
        padding-right: 0;
      }
      
      /* Tables */
      mtable {
        math-style: inherit;
      }
      mtd {
        math-depth: auto-add;
        math-style: compact;
        math-shift: compact;
      }
      
      /* Equations */
      mtable.multiline-equation mtd {
        math-depth: inherit;
        math-style: inherit;
        math-shift: inherit;
        padding: 0;
      }
      math > mtable.multiline-equation mtr:not(:last-child) mtd {
        padding-bottom: 0.5em;
      }
      
      /* Fractions */
      mfrac {
        padding-inline: 0;
        margin-inline: 0.1em;
      }
      
      /* Accents */
      mover[accent="true" i] > :first-child {
        font-feature-settings: "dtls";
      }
      mover.dotted[accent="true" i] > :first-child {
        font-feature-settings: "dtls" 0;
      }
      
      /* Other rules for scriptlevel, displaystyle and math-shift */
      munder > :nth-child(2),
      munderover > :nth-child(2) {
        math-shift: compact
      }
      munder[accentunder="true" i] > :not(:first-child),
      mover[accent="true" i] > :not(:first-child) {
        math-depth: inherit;
        math-style: inherit;
        math-shift: inherit;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/function-plot/1.25.1/function-plot.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/1.5.2/math.min.js">
    </script>
    <link rel="stylesheet" href="../../assets/styles.css">
    <div id="view">
      <style>
        body {
          background-color: var(--foreground);
        }
        .menu {
          background-color: var(--foreground);
        }
        .menu a {
          color: var(--background);
        }
        .menu a:hover {
          color: var(--foreground);
          background-color: var(--background);
        }
      </style>
      <div class="menu">
        <div class="menu-main"><span class="connect"><a href="../../index.html">Research</a></span></div>
        <div class="menu-sub">
          <div class="directory"><span class="connect"><a href="../../about.html">About</a></span></div>
        </div>
      </div>
      <h2>Inferring Structural Balance in signed networks</h2>
    </div>
  </body>
</html>
